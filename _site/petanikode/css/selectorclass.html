<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selector class</title>
    <style type="text/css">
        .pink{
        color: white;
        background: pink;
        padding: 5px;
        }
        .text-white {
        color: white;
        }

        .bg-teal {
        background: teal;
        }
    </style>
</head>
<body>
    <h2 class="text-white bg-teal">ini adalah judul</h2>
    <p>saya sedang belajar <b class="pink">CSS</b> di petanikode.com.</p>
</body>
</html>
