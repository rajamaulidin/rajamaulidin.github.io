<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh internal CSS</title>
    <!-- penulisan internal css dalam tag head -->
    <style type="text/css">
        p{
            font-family: serif;
            line-height: 1.75em;
            font-size: 18px;
        }
        i{
            font-family: sans-serif;
            color: orange;
        }
    </style>
</head>

<body>
    <!-- penulisan internal css dalam teks body -->
    <style type="text/css">
        h2{
            font-family: sans-serif;
            color: #333;
        }
    </style>
    <h2>ini adalah judul artikel</h2>
    <p>paragraf ini hanya untuk percobaan saja. percobaan untuk mendemokan <i>internal CSS</i> adalah kode css yang dikirim langsung dalam file HTML.</p>
</body>

</html>
